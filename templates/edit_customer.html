{% extends "base.html" %}

{% block title %}Edit Customer - Medical Store{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Edit Customer</h1>
        <p>Update customer information.</p>
    </div>

    <a href="/customers" class="btn-secondary">
        ← Back to Customers
    </a>
</div>

<div class="form-container">

    <form method="POST">

        <div class="form-group">
            <label for="name">Customer Name</label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ customer.name }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                value="{{ customer.phone }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ customer.email }}"
            >
        </div>

        <div class="form-group">
            <label for="address">Address</label>

            <textarea
                id="address"
                name="address"
                rows="4"
            >{{ customer.address }}</textarea>
        </div>

        <div class="form-actions">

            <a href="/customers" class="btn-secondary">
                Cancel
            </a>

            <button type="submit" class="btn-primary">
                Update Customer
            </button>

        </div>

    </form>

</div>

{% endblock %}
