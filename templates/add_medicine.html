{% extends "base.html" %}

{% block title %}Add Medicine - Medical Store{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Add Medicine</h1>
        <p>Add a new medicine to your inventory.</p>
    </div>

    <a href="/medicines" class="btn-secondary">← Back to Medicines</a>
</div>

<div class="form-container">

    <form method="POST" action="/medicines/add">

        <div class="form-group">
            <label for="name">Medicine Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter medicine name"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <input
                type="text"
                id="category"
                name="category"
                placeholder="e.g. Tablet, Capsule, Syrup"
                required
            >
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="price">Price</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    step="0.01"
                    min="0"
                    placeholder="Enter price"
                    required
                >
            </div>

            <div class="form-group">
                <label for="stock">Stock</label>
                <input
                    type="number"
                    id="stock"
                    name="stock"
                    min="0"
                    placeholder="Enter stock quantity"
                    required
                >
            </div>

        </div>

        <div class="form-actions">

            <a href="/medicines" class="btn-secondary">
                Cancel
            </a>

            <button type="submit" class="btn-primary">
                Add Medicine
            </button>

        </div>

    </form>

</div>

{% endblock %}
